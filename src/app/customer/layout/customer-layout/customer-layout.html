<div class="flex flex-col min-h-screen">
  <p
    class="bg-[#101010] px-5 py-1.5 text-center text-[0.625rem] leading-[1.45] font-semibold tracking-[0.2em] text-white uppercase min-[72rem]:hidden"
  >
    {{ 'CUSTOMER.ANNOUNCEMENT' | translate }}
  </p>
  <app-navbar
    class="sticky top-0 z-30 block"
    [brand]="brand"
    [links]="navigation"
    [actions]="actions"
    [mobileSupportLinks]="mobileSupportLinks"
  />

  <main class="flex-1">
    <router-outlet />
  </main>

  <app-footer
    [brand]="brand"
    tagline="FOOTER.TAGLINE"
    supportingLine="FOOTER.SUPPORTING_LINE"
    [website]="website"
    [shopLinks]="shopLinks"
    [careLinks]="careLinks"
    [aboutLinks]="aboutLinks"
    [legalLinks]="legalLinks"
    [socialLinks]="socialLinks"
  />
</div>

<app-shopping-bag />
